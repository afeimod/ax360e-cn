plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'aenu.ax360e'
    compileSdk 35

    defaultConfig {
        applicationId "aenu.ax360e.free"
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName "0.14"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                cppFlags ''
            }
        }
        sourceSets{
            main {
                //jniLibs.srcDirs = ['src/main/libs']
            }
        }
    }
    signingConfigs {
        debug {
            // Re-use the auto-generated debug keystore for release builds.
            // The release APK is therefore signed with the standard Android
            // debug key — fine for sideloading, not for Play Store upload.
            // For a real release, replace this with your own keystore:
            //   storeFile file('my-release-key.jks')
            //   storePassword '...'
            //   keyAlias '...'
            //   keyPassword '...'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the debug keystore so CI can produce an
            // installable APK without any external secrets. Swap to
            // signingConfigs.myRelease for a Play Store build.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            //abiFilters 'arm64-v8a'
            //cppFlags ''
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging{
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.preference
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}